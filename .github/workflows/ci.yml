name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: garage_test
          POSTGRES_USER: garage_test
          POSTGRES_PASSWORD: garage_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garage_test -d garage_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://garage_test:garage_ci_test_only@127.0.0.1:5432/garage_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: go test -run '^Test(Versions|Member)' -v ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/test-upload-inputs.mjs
      - run: node scripts/test-relative-time.mjs
      - run: node scripts/package-production.mjs
