name: prototype-publisher
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prototype
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prototype -d prototype"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      DATABASE_URL: postgres://prototype:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/prototype?sslmode=disable
      LISTEN_ADDR: :8081
      DATA_DIR: /data
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      PUBLIC_PORT: ${PUBLIC_PORT:-8080}
      ADMIN_HOSTS: ${ADMIN_HOSTS:-console.localhost,127.0.0.1}
      PUBLIC_URL_MODE: ${PUBLIC_URL_MODE:-path}
      CONSOLE_URL: ${CONSOLE_URL:-http://console.localhost:8080}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:?Set INIT_ADMIN_PASSWORD in .env}
    volumes:
      - release_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
  release_data:
